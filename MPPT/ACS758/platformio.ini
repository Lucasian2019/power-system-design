; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

lib_deps = 
    arduino-libraries/LiquidCrystal

; Use this environment to build the Proteus-friendly version. It omits ESP32
; Preferences/NVS and LEDC PWM, which Proteus commonly does not emulate.
[env:proteus]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
build_flags = -D PROTEUS_SIMULATION=1

lib_deps =
    arduino-libraries/LiquidCrystal

; Most Proteus ESP32 parts model the original ESP32, not ESP32-S3.
; Use this build when the Proteus component is labelled ESP32 / ESP32-WROOM.
[env:proteus-esp32]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -D PROTEUS_SIMULATION=1

lib_deps =
    arduino-libraries/LiquidCrystal
